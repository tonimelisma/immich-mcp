# Weekly update proposals, one grouped pull request per ecosystem. Security updates open right
# away regardless. Keep one entry per ecosystem the repository uses; actions are pinned by commit
# SHA with a `# vX.Y.Z` comment, which Dependabot keeps up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      npm-packages:
        patterns: ['*']
    ignore:
      # Majors that need a coordinated change: typescript-eslint's peer range caps typescript.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      docker-images:
        patterns: ['*']
    ignore:
      # The image follows the Node line CI tests (setup-node 24); a new line changes both.
      - dependency-name: node
        update-types: ['version-update:semver-major']
