name: Image

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write # to tag releases and delete merged branches
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A new version in package.json on main is a release: tag it vX.Y.Z and publish the X.Y.Z image
      # in this run, since tags pushed with GITHUB_TOKEN start no workflows. A rerun of the same commit
      # publishes the version again.
      - id: release
        if: github.ref == 'refs/heads/main'
        run: |
          version=$(node -p "require('./package.json').version")
          if ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            git tag "v$version" "$GITHUB_SHA"
            git push origin "v$version"
          fi
          if [ "$(git rev-list -n 1 "v$version")" = "$GITHUB_SHA" ]; then
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.tag != '' }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Work branches (branch/*, claude/*) are done once main contains them.
      - name: Delete merged session branches
        if: github.ref == 'refs/heads/main'
        run: |
          for b in $(git branch -r --merged origin/main --format='%(refname:lstrip=3)'); do
            case "$b" in branch/* | claude/*) git push origin --delete "$b" ;; esac
          done
