name: Release

# Publishes ghcr.io/tonimelisma/immich-mcp, and only from main.
#
# Every push to main runs this. When package.json carries a version that has no tag yet, that push is
# the release: main is tagged vX.Y.Z here, the image is built once for amd64 and arm64 with an SBOM and
# provenance, published as X.Y.Z, X.Y and latest, given a build-provenance attestation signed by this
# workflow on refs/heads/main, and a GitHub release is created from its CHANGELOG.md section. Nothing
# else builds release images: no tag push or other branch starts this workflow, and it refuses to run
# anywhere but main. Deployers can require the attestation:
#
#   gh attestation verify oci://ghcr.io/tonimelisma/immich-mcp@<digest> --repo tonimelisma/immich-mcp \
#     --signer-workflow tonimelisma/immich-mcp/.github/workflows/release.yml --source-ref refs/heads/main
#
# Any other push to main publishes only edge and sha-<commit>, for testing; latest never moves without
# a release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # tag releases and create GitHub releases
  packages: write
  id-token: write # sign the attestation
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Only main releases
        run: |
          if [[ $GITHUB_REF != refs/heads/main ]]; then
            echo "::error::releases come only from main, not $GITHUB_REF"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Tags pushed with GITHUB_TOKEN start no workflow, and no workflow builds from tags anyway.
      - id: release
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi
          # A version already released from an earlier commit is not released again.
          [[ $(git rev-list -n 1 "$tag") == "$GITHUB_SHA" ]] || tag=''
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.tag != '' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.tag != '' }}
            type=raw,value=edge
            type=sha
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: GitHub release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## " v " " {f = 1; next} /^## / && f {exit} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [[ -s $RUNNER_TEMP/notes.md ]] || echo "See CHANGELOG.md." > "$RUNNER_TEMP/notes.md"
          printf '\nImage: `ghcr.io/%s:%s` (`%s`)\n' "$GITHUB_REPOSITORY" "${TAG#v}" "$DIGEST" >> "$RUNNER_TEMP/notes.md"
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
