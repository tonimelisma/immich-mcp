name: Release

# Publishes ghcr.io/tonimelisma/immich-mcp for every commit that lands on main and passes CI. This
# is the only workflow that creates tags, releases, image tags, attestations or signatures.
#
# The version is the next patch in the series that package.json's version names (its major.minor):
# one above the highest vX.Y.Z tag of that series, or X.Y.0 for a new series. The image is built
# once for amd64 and arm64 with an SBOM and provenance and pushed by digest only; that digest is
# checked (script/image-smoke), given a build-provenance attestation and a keyless cosign signature,
# both by this file running on refs/heads/main; only then is main tagged vX.Y.Z and the image
# tagged X.Y.Z, X.Y, latest and sha-<commit>. Consumers can require the attestation:
#
#   gh attestation verify oci://ghcr.io/tonimelisma/immich-mcp@<digest> --repo tonimelisma/immich-mcp \
#     --signer-workflow tonimelisma/immich-mcp/.github/workflows/release.yml --source-ref refs/heads/main
#
# So nothing here may run from another branch, nothing triggers on tags, and this file keeps its
# name. Scheduled and pull-request runs of CI never release.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    # One release at a time, so two runs can never claim the same version. On the job, not the
    # workflow: every CI run (pull requests too) starts this workflow, and a workflow-level group
    # let those skipped runs cancel a pending release.
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # the tag and the GitHub release
      packages: write # the image, its attestation and signature
      id-token: write # sign the attestation and the image (Sigstore, GitHub OIDC)
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IMAGE: ghcr.io/${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Refuse anything but main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Releases are published only from refs/heads/main, not $REF"
            exit 1
          fi

      # The commit CI tested, not whatever main points at now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Choose the version
        id: version
        run: |
          set -euo pipefail
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          series=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          [[ "v$series.0" =~ $semver ]] || { echo "::error::package.json names no X.Y series: $series"; exit 1; }
          highest=$(git tag --list 'v*' | grep -E "$semver" | sort -V | tail -n1 || true)

          # A tag already on this commit means an earlier run claimed it: finish that release.
          existing=$(git tag --points-at "$SHA" | grep -E "$semver" | sort -V | tail -n1 || true)
          if [ -n "$existing" ]; then
            echo "$SHA is already tagged $existing; finishing that release."
            version=$existing
            create_tag=false
          else
            # CI runs for consecutive merges can finish out of order: never release a commit older
            # than the highest release.
            if [ -n "$highest" ] && ! git merge-base --is-ancestor "$(git rev-list -n1 "$highest")" "$SHA"; then
              echo "::error::$SHA does not contain $highest; refusing to release an older commit"
              exit 1
            fi
            in_series=$(git tag --list "v$series.*" | grep -E "$semver" | sort -V | tail -n1 || true)
            if [ -n "$in_series" ]; then
              version="v$series.$(( ${in_series##*.} + 1 ))"
            else
              version="v$series.0"
            fi
            if [ -n "$highest" ] && [ "$(printf '%s\n%s\n' "$highest" "$version" | sort -V | tail -n1)" != "$version" ]; then
              echo "::error::$version (series $series from package.json) is not higher than $highest"
              exit 1
            fi
            create_tag=true
          fi
          if [ -z "$highest" ] || [ "$(printf '%s\n%s\n' "$highest" "$version" | sort -V | tail -n1)" = "$version" ]; then
            latest=true
          else
            latest=false
          fi
          echo "Releasing $SHA as $version (previous highest: ${highest:-none}, latest: $latest)."
          {
            echo "version=$version"
            echo "number=${version#v}"
            echo "series=$series"
            echo "create_tag=$create_tag"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

      # The image reports the version through package.json (src/version.ts), so stamp it before the
      # build. Not committed: main's package.json keeps naming only the series.
      - name: Stamp the version
        env:
          NUMBER: ${{ steps.version.outputs.number }}
        run: npm version "$NUMBER" --no-git-tag-version --allow-same-version

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Pushed untagged, by digest: nobody pulling a tag sees it until it is checked, attested and
      # signed below.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.title=immich-mcp
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.number }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha

      - name: Check the pushed image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          NUMBER: ${{ steps.version.outputs.number }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          script/image-smoke "$IMAGE@$DIGEST" "$NUMBER"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Create the tag
        if: steps.version.outputs.create_tag == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: gh api "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$VERSION" -f "sha=$SHA"

      - name: Tag the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          NUMBER: ${{ steps.version.outputs.number }}
          SERIES: ${{ steps.version.outputs.series }}
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          set -euo pipefail
          tags=(-t "$IMAGE:$NUMBER" -t "$IMAGE:sha-${SHA:0:7}")
          if [ "$LATEST" = true ]; then tags+=(-t "$IMAGE:$SERIES" -t "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$DIGEST"

      - name: Publish the GitHub release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NUMBER: ${{ steps.version.outputs.number }}
          DIGEST: ${{ steps.build.outputs.digest }}
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          set -euo pipefail
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            printf 'Image: `%s:%s` (`%s`)\n' "$IMAGE" "$NUMBER" "$DIGEST" > "$RUNNER_TEMP/notes.md"
            gh release create "$VERSION" --verify-tag --title "$VERSION" --generate-notes \
              --notes-file "$RUNNER_TEMP/notes.md" "--latest=$LATEST"
          fi

      # Validates: IM-080 (on every release: version, tag and image tags)
      # Validates: IM-081 (on every release: attestation and signature by this file on main)
      - name: Verify the release like a consumer would
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NUMBER: ${{ steps.version.outputs.number }}
          SERIES: ${{ steps.version.outputs.series }}
          DIGEST: ${{ steps.build.outputs.digest }}
          LATEST: ${{ steps.version.outputs.latest }}
          WORKFLOW: ${{ github.repository }}/.github/workflows/release.yml
        run: |
          set -euo pipefail
          tagged=$(gh api "repos/$GH_REPO/git/ref/tags/$VERSION" --jq .object.sha)
          [ "$tagged" = "$SHA" ] || { echo "::error::$VERSION points at $tagged, not $SHA"; exit 1; }
          check=("$NUMBER" "sha-${SHA:0:7}")
          if [ "$LATEST" = true ]; then check+=("$SERIES" latest); fi
          for t in "${check[@]}"; do
            d=$(docker buildx imagetools inspect "$IMAGE:$t" --format '{{json .Manifest}}' | jq -r .digest)
            [ "$d" = "$DIGEST" ] || { echo "::error::$IMAGE:$t is $d, not the checked $DIGEST"; exit 1; }
          done
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GH_REPO" \
            --signer-workflow "$WORKFLOW" --source-ref refs/heads/main >/dev/null
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/$WORKFLOW@refs/heads/main" >/dev/null
          echo "Released $IMAGE:$NUMBER ($DIGEST) as $VERSION; attestation and signature verified." >> "$GITHUB_STEP_SUMMARY"
